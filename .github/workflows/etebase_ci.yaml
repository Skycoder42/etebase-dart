name: CI/CD for etebase

on:
  workflow_dispatch:
  push:
    paths:
      - "packages/etebase/**"
      - ".github/workflows/etebase_ci.yaml"
      - ".github/workflows/etebase_cd.yaml"

jobs:
  ci:
    name: CI
    uses: Skycoder42/dart_test_tools/.github/workflows/dart.yml@main
    with:
      workingDirectory: packages/etebase
      buildRunner: true
      panaScoreThreshold: 10
      unitTestPaths: -P unit
      coverageExclude: >-
        "**/*.freezed.dart"
        "**/*.g.dart"
      integrationTestPaths: -P integration
      integrationTestCacheConfig: >-
        {
          "key": "etebase-cache_1.0.20_0.7.15",
          "path": "packages/etebase/tool/integration/cache"
        }
      integrationTestSetup: >-
        {
          "linux": "bash tool/integration/setup_linux.sh",
          "macos": "bash tool/integration/setup_macos.sh",
          "windows": "bash tool/integration/setup_win.sh 1.0.20"
          "web": "bash tool/integration/setup_web.sh 0.7.15"
        }

  cd:
    name: CD
    uses: Skycoder42/dart_test_tools/.github/workflows/release.yml@main
    needs:
      - ci
    with:
      workingDirectory: packages/etebase
      tagPrefix: etebase-v
    secrets:
      githubToken: ${{ secrets.GH_PAT }}
