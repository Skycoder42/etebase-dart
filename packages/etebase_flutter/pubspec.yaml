name: etebase_flutter
description: Flutter extensions for the dart implementation of etebase.
version: 2.0.1
homepage: https://github.com/Skycoder42/etebase-dart

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"
resolution: workspace

dependencies:
  etebase: ^2.0.3
  flutter:
    sdk: flutter
  hive_ce_flutter: ^2.3.4
  material_ui: ^1.0.0
  meta: ^1.19.0
  package_info_plus: ^10.2.1
  sodium: ^4.0.4

dev_dependencies:
  dart_pre_commit: ^6.1.4
  dart_test_tools: ^7.3.0
  flutter_test:
    sdk: flutter
  path: ^1.9.1
  path_provider_platform_interface: ^2.1.3

cider:
  link_template:
    tag: https://github.com/Skycoder42/etebase-dart/releases/tag/etebase_flutter-v%tag%
    diff: https://github.com/Skycoder42/etebase-dart/compare/etebase_flutter-v%from%...etebase_flutter-v%to%
