name: etebase_flutter
description: Flutter extensions for the dart implementation of etebase.
version: 2.0.0
homepage: https://github.com/Skycoder42/etebase-dart

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"
resolution: workspace

dependencies:
  etebase: ^2.0.2
  flutter:
    sdk: flutter
  hive_ce_flutter: ^2.3.1
  meta: ^1.16.0
  package_info_plus: ^8.3.0
  sodium_libs: ^3.4.6+1

dev_dependencies:
  custom_lint: ^0.8.0
  dart_pre_commit: ^5.4.7
  dart_test_tools: ^6.2.1
  flutter_test:
    sdk: flutter
  path: ^1.9.1
  path_provider_platform_interface: ^2.1.2

cider:
  link_template:
    tag: https://github.com/Skycoder42/etebase-dart/releases/tag/etebase_flutter-v%tag%
    diff: https://github.com/Skycoder42/etebase-dart/compare/etebase_flutter-v%from%...etebase_flutter-v%to%
