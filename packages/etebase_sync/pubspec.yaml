name: etebase_sync
description: A repository based wrapper around etebase for easy, offline-enabled use.
version: 1.0.0
repository: https://github.com/Skycoder42/etebase-dart

environment:
  sdk: ^3.8.0
resolution: workspace

dependencies:
  etebase: ^2.0.2
  freezed_annotation: ^3.0.0
  hive_ce: ^2.11.3
  json_annotation: ^4.9.0
  meta: ^1.16.0
  msgpack_codec: ^2.0.2
  rxdart: ^0.28.0

dev_dependencies:
  build_runner: ^2.5.4
  custom_lint: ^0.7.5
  dart_pre_commit: ^5.4.5
  dart_test_tools: ^6.1.1
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  mockito: ^5.4.6
  sodium: ^3.4.5
  test: ^1.25.15

cider:
  link_template:
    tag: https://github.com/Skycoder42/etebase-dart/releases/tag/etebase_sync-v%tag%
    diff: https://github.com/Skycoder42/etebase-dart/compare/etebase_sync-v%from%...etebase_sync-v%to%

