name: etebase_sync
description: A repository based wrapper around etebase for easy, offline-enabled use.
version: 1.0.0
repository: https://github.com/Skycoder42/etebase-dart

environment:
  sdk: ^3.8.0
resolution: workspace

dependencies:
  etebase: ^2.0.2
  freezed_annotation: ^3.1.0
  hive_ce: ^2.11.3
  json_annotation: ^4.9.0
  logging: ^1.3.0
  meta: ^1.16.0
  msgpack_codec: ^2.0.2
  rxdart: ^0.28.0
  sodium: ^3.4.6
  synchronized: ^3.4.0

dev_dependencies:
  build_runner: ^2.6.0
  custom_lint: ^0.8.0
  dart_pre_commit: ^5.4.7
  dart_test_tools: ^6.2.1
  freezed: ^3.2.0
  json_serializable: ^6.10.0
  mockito: ^5.5.0
  test: ^1.25.15

cider:
  link_template:
    tag: https://github.com/Skycoder42/etebase-dart/releases/tag/etebase_sync-v%tag%
    diff: https://github.com/Skycoder42/etebase-dart/compare/etebase_sync-v%from%...etebase_sync-v%to%

