targets:
  $default:
    sources:
      - $package$
      - lib/**
      - pubspec.yaml
      - test/**
    builders:
      json_serializable:
        options:
          any_map: true
          checked: true
          explicit_to_json: true
      source_gen:combining_builder:
        options:
          ignore_for_file:
            - type=lint
            - strict_raw_type
      dart_test_tools:dart_test_tools_builders:
        enabled: true

