targets:
  $default:
    sources:
      - $package$
      - lib/**
      - pubspec.yaml
    builders:
      freezed:
        options:
          copy_with: false
          map: false
          when: false
      json_serializable:
        options:
          any_map: true
          checked: true
          explicit_to_json: true
      pubspec_generator:
        options:
          output: lib/gen/pubspec.g.dart

