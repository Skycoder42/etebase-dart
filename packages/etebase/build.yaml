targets:
  $default:
    sources:
      - $package$
      - lib/**
      - pubspec.yaml
      - test/unit/**
    builders:
      freezed:
        options:
          copy_with: false
          map: false
          when: false
      json_serializable:
        options:
          any_map: true
          checked: true
          explicit_to_json: true
      dart_test_tools:dart_test_tools_builders:
        enabled: true
      source_gen:combining_builder:
        options:
          ignore_for_file:
            - type=lint
            - strict_raw_type

