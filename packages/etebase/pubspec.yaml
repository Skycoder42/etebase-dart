name: etebase
description: Dart client library for etebase, base on the javascript port.
version: 2.0.0
repository: https://github.com/Skycoder42/etebase-dart

environment:
  sdk: ^3.7.0
resolution: workspace

dependencies:
  collection: ^1.19.1
  freezed_annotation: ^3.0.0
  hive_ce: ^2.11.1
  http: ^1.3.0
  http_parser: ^4.1.2
  json_annotation: ^4.9.0
  meta: ^1.16.0
  msgpack_codec: ^2.0.2
  sodium: ^3.4.5
  synchronized: ^3.3.1
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  async: ^2.13.0
  build_runner: ^2.4.15
  custom_lint: ^0.7.5
  dart_pre_commit: ^5.4.5
  dart_test_tools: ^6.1.1
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  mockito: ^5.4.5
  path: ^1.9.1
  stream_channel: ^2.1.4
  test: ^1.25.15
  uuid: ^4.5.1

dart_pre_commit:
  pull-up-dependencies:
    allowed:
      - collection
      - meta
