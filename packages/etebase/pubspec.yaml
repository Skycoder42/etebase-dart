name: etebase
description: Dart native client library for etebase and etesync.
version: 2.0.3
repository: https://github.com/Skycoder42/etebase-dart

environment:
  sdk: ^3.13.0
resolution: workspace

dependencies:
  collection: ^1.19.1
  freezed_annotation: ^3.1.0
  hive_ce: ^2.19.3
  http: ^1.6.0
  http_parser: ^4.1.2
  json_annotation: ^4.12.0
  meta: ^1.19.0
  msgpack_codec: ^2.0.2
  sodium: ^4.1.0
  synchronized: ^3.4.1+2
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  async: ^2.13.1
  build_runner: ^2.16.0
  dart_pre_commit: ^6.1.4
  dart_test_tools: ^7.3.2
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  mockito: ^5.8.1
  path: ^1.9.1
  stream_channel: ^2.1.4
  test: ^1.31.1
  uuid: ^4.6.0

cider:
  link_template:
    tag: https://github.com/Skycoder42/etebase-dart/releases/tag/etebase-v%tag%
    diff: https://github.com/Skycoder42/etebase-dart/compare/etebase-v%from%...etebase-v%to%

dart_pre_commit:
  pull-up-dependencies:
    allowed:
      - collection
      - meta
