name: etebase
description: Dart client library for etebase using FFI bindings with libetebase
version: 1.0.3
homepage: https://github.com/Skycoder42/etebase-dart

environment:
  sdk: ^3.5.0

platforms:
  linux:
  macos:
  windows:
  android:
  ios:

dependencies:
  ffi: ^2.1.3
  freezed_annotation: ^2.4.4
  meta: ^1.15.0
  synchronized: ^3.3.0+3

dev_dependencies:
  analyzer: ^6.7.0
  build: ^2.4.1
  build_config: ^1.1.1
  build_runner: ^2.4.13
  code_builder: ^4.10.1
  custom_lint: ^0.6.8
  dart_pre_commit: ^5.4.0
  dart_test_tools: ^6.0.0
  ffigen: ^15.0.0
  freezed: ^2.5.7
  mocktail: ^1.0.4
  source_gen: ^1.5.0
  source_helper: ^1.3.4
  test: ^1.25.8
  uuid: ^4.5.1

ffigen:
  output: lib/src/gen/ffi/libetebase.ffi.dart
  name: LibEtebaseFFI
  description: Bindings for libetebase
  headers:
    entry-points:
      - /usr/include/etebase/etebase.h
  compiler-opts:
    - "-I/usr/lib/clang/14/include/"
  macros:
    include:
      - ETEBASE_.*
  globals:
    include:
      - ETEBASE_.*
  enums:
    include:
      - Etebase_.*
  structs:
    include:
      - Etebase.*
  unions:
    include:
      - Etebase.*
  functions:
    include:
      - etebase_.*
  comments: true
  preamble: >-
    // ignore_for_file:
    require_trailing_commas,
    non_constant_identifier_names,
    prefer_expression_function_bodies,
    lines_longer_than_80_chars,
    comment_references,
    avoid_positional_boolean_parameters,
    camel_case_types,
    public_member_api_docs

cider:
  link_template:
    tag: https://github.com/Skycoder42/etebase-dart/releases/tag/etebase-v%tag%
    diff: https://github.com/Skycoder42/etebase-dart/compare/etebase-v%from%...etebase-v%to%

dart_pre_commit:
  pull-up-dependencies:
    allowed:
      - meta
      - analyzer
