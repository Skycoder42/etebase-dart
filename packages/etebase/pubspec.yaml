name: etebase
description: Dart client library for etebase, base on the javascript port.
version: 2.0.0
repository: https://github.com/Skycoder42/etebase-dart

environment:
  sdk: ^3.5.0

dependencies:
  chopper: ^8.0.3
  collection: ^1.18.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  meta: ^1.15.0
  msgpack_dart: ^1.0.1
  sodium: ^3.4.0

dev_dependencies:
  build_runner: ^2.4.13
  chopper_generator: ^8.0.3
  custom_lint: ^0.6.8
  dart_pre_commit: ^5.4.0
  dart_test_tools: ^6.0.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4
  test: ^1.25.8

dart_pre_commit:
  pull-up-dependencies:
    allowed:
      - collection
      - meta
