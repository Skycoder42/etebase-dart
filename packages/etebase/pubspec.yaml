name: etebase
description: Dart native client library for etebase and etesync.
version: 2.0.2
repository: https://github.com/Skycoder42/etebase-dart

environment:
  sdk: ^3.8.0
resolution: workspace

dependencies:
  collection: ^1.19.1
  freezed_annotation: ^3.1.0
  hive_ce: ^2.11.3
  http: ^1.5.0
  http_parser: ^4.1.2
  json_annotation: ^4.9.0
  meta: ^1.16.0
  msgpack_codec: ^2.0.2
  sodium: ^3.4.6
  synchronized: ^3.4.0
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  async: ^2.13.0
  build_runner: ^2.6.0
  custom_lint: ^0.8.0
  dart_pre_commit: ^5.4.7
  dart_test_tools: ^6.2.1
  freezed: ^3.2.0
  json_serializable: ^6.10.0
  mockito: ^5.5.0
  path: ^1.9.1
  stream_channel: ^2.1.4
  test: ^1.25.15
  uuid: ^4.5.1

cider:
  link_template:
    tag: https://github.com/Skycoder42/etebase-dart/releases/tag/etebase-v%tag%
    diff: https://github.com/Skycoder42/etebase-dart/compare/etebase-v%from%...etebase-v%to%

dart_pre_commit:
  pull-up-dependencies:
    allowed:
      - collection
      - meta
